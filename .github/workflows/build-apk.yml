name: Build JARVIS Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync PWA assets into Android APK
        run: |
          mkdir -p android-apk/app/src/main/assets/www
          cp -r pwa/* android-apk/app/src/main/assets/www/
          mkdir -p android-apk/app/src/main/res/mipmap-xxxhdpi
          cp pwa/icon-192.png android-apk/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android-apk
        run: gradle assembleDebug --no-daemon

      - name: Copy APK with clean name
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk JARVIS-Mobile.apk

      - name: Upload JARVIS-Mobile.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-APK
          path: JARVIS-Mobile.apk

      - name: Publish direct-download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest JARVIS-Mobile.apk \
            --title "J.A.R.V.I.S Mobile Pro (Android APK)" \
            --notes "Avtomatik yig'ilgan J.A.R.V.I.S Mobile Pro Android APK ilovasi." \
            --latest
